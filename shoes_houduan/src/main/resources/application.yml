server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shoes?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    # 本地开发默认放开；生产请在 Render 中设置 CORS_ALLOWED_ORIGINS 为前端域名（可逗号分隔）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string}
    expires-minutes: ${JWT_EXPIRES_MINUTES:1440}
  auth:
    dev:
      enabled: ${AUTH_DEV_ENABLED:false}
      accept-any-password: ${AUTH_DEV_ACCEPT_ANY_PASSWORD:false}
      fixed-password: ${AUTH_DEV_FIXED_PASSWORD:}
